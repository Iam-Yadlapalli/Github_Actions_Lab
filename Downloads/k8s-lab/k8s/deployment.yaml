apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-lab-app
  labels:
    app: k8s-lab-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: k8s-lab-app
  template:
    metadata:
      labels:
        app: k8s-lab-app
    spec:
      containers:
        - name: k8s-lab-app
          # This image tag gets replaced by the CI/CD pipeline on every push
          image: ghcr.io/YOUR_GITHUB_USERNAME/k8s-lab-app:latest
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
