name: CI-CD to Local Kubernetes
on:
  push:
    branches: [ "main" ]
env:
  REGISTRY: ghcr.io
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase image name
        id: image_name
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set image tag
        id: meta
        run: echo "tag=${{ env.REGISTRY }}/${{ steps.image_name.outputs.name }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: |
            ${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.image_name.outputs.name }}:latest

  deploy:
      
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy manifests
        shell: pwsh
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      - name: Update image to newly built tag
        shell: pwsh
        run: |
          kubectl set image deployment/k8s-lab-app k8s-lab-app=${{ needs.build-and-push.outputs.image_tag }}
          kubectl rollout status deployment/k8s-lab-app --timeout=120s